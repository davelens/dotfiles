# Explicit public files only. No glob, clean, relink, backup or shell directives.
- link:
    $HOME/.bash_profile: config/bash_profile
    $HOME/.bashrc: config/bashrc
    $BASH_PROFILE: config/bash_profile
    $BASHRC: config/bashrc
    $HOME/.ssh/dots-client.conf: config/ssh/client.conf
    $XDG_BIN_HOME/utility: bin/utility
    $XDG_BIN_HOME/dots: bin/autoload/dots
    $XDG_BIN_HOME/os: bin/autoload/os
    $XDG_BIN_HOME/fs: bin/autoload/fs
    $XDG_BIN_HOME/float: bin/autoload/float
    $XDG_CONFIG_HOME/ack/ackrc: config/ack/ackrc
    $XDG_CONFIG_HOME/btop/btop.conf: config/btop/btop.conf
    $XDG_CONFIG_HOME/btop/themes/catppuccin_frappe.theme: config/btop/themes/catppuccin_frappe.theme
    $XDG_CONFIG_HOME/btop/themes/catppuccin_latte.theme: config/btop/themes/catppuccin_latte.theme
    $XDG_CONFIG_HOME/btop/themes/catppuccin_macchiato.theme: config/btop/themes/catppuccin_macchiato.theme
    $XDG_CONFIG_HOME/btop/themes/catppuccin_mocha.theme: config/btop/themes/catppuccin_mocha.theme
    $XDG_CONFIG_HOME/dialog/dialogrc: config/dialog/dialogrc
    $XDG_CONFIG_HOME/editline/editrc: config/editline/editrc
    $XDG_CONFIG_HOME/git/config: config/git/config
    $XDG_CONFIG_HOME/git/ignore: config/git/ignore
    $XDG_CONFIG_HOME/irb/irbrc: config/irb/irbrc
    $XDG_CONFIG_HOME/mise/config.toml: config/mise/config.toml
    $XDG_CONFIG_HOME/mycli/myclirc: config/mycli/myclirc
    $XDG_CONFIG_HOME/nethack/config: config/nethack/config
    $XDG_CONFIG_HOME/npm/npmrc: config/npm/npmrc
    $XDG_CONFIG_HOME/readline/inputrc: config/readline/inputrc
    $XDG_CONFIG_HOME/rspec/options: config/rspec/options
    $XDG_CONFIG_HOME/rsyncignore/rsyncignore: config/rsyncignore/rsyncignore
    $XDG_CONFIG_HOME/rubocop/config.yml: config/rubocop/config.yml
    $XDG_CONFIG_HOME/shellcheckrc/shellcheckrc: config/shellcheckrc/shellcheckrc
    $XDG_CONFIG_HOME/starship/config.toml: config/starship/config.toml
    $XDG_CONFIG_HOME/tmux/tmux.conf: config/tmux/tmux.conf
    $XDG_CONFIG_HOME/tmux/config/keymaps.conf: config/tmux/config/keymaps.conf
    $XDG_CONFIG_HOME/tmux/config/options.conf: config/tmux/config/options.conf
    $XDG_CONFIG_HOME/tmux/config/segments.conf: config/tmux/config/segments.conf
    $XDG_CONFIG_HOME/tmux/config/theme.conf: config/tmux/config/theme.conf
    $XDG_CONFIG_HOME/wget/config: config/wget/config
- create:
    - $GNUPGHOME
    - $XDG_STATE_HOME/bash
    - $XDG_DATA_HOME/irb
    - $XDG_DATA_HOME/mycli
    - $XDG_DATA_HOME/fonts
    - $HOME/.ssh/sockets
